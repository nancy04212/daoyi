<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日道義">
<meta name="theme-color" content="#f7f2e8">
<meta name="description" content="每天一則經典、訓文故事，附逐句細解與練講工具。">
<title>每日道義</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* apply saved reading prefs before paint (no flash) */
(function(){try{
  var g=function(k,d){var v=localStorage.getItem("dy:"+k);return v==null?d:JSON.parse(v)};
  var t=g("theme","auto"), r=document.documentElement;
  if(t==="auto") t=matchMedia("(prefers-color-scheme: dark)").matches?"night":"sepia";
  r.dataset.theme=t; r.dataset.font=g("font","serif");
  r.style.setProperty("--fs",g("fs",18)+"px"); r.style.setProperty("--lh",g("lh",2));
}catch(e){document.documentElement.dataset.theme="sepia"}})();
</script>
<style>
/* ============ themes ============ */
:root{
  --fs:18px; --lh:2; --tabh:56px; --side:248px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serifF:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --red:#a3301f; --gold:#a8822f;
}
html[data-theme="paper"]{--bg:#ffffff;--bg2:#f4f1ec;--card:#faf8f5;--ink:#222222;--ink2:#4f4a45;--mute:#8d867e;--line:rgba(0,0,0,.1);--fill:rgba(0,0,0,.05);--mark:rgba(168,130,47,.22)}
html[data-theme="sepia"]{--bg:#f7f2e8;--bg2:#efe7d6;--card:#fffcf6;--ink:#2e2620;--ink2:#5a4e44;--mute:#94877a;--line:rgba(70,45,20,.12);--fill:rgba(70,45,20,.06);--mark:rgba(168,130,47,.24)}
html[data-theme="green"]{--bg:#e6eedc;--bg2:#d9e4cd;--card:#f1f6ea;--ink:#25301f;--ink2:#46533d;--mute:#7d8a72;--line:rgba(30,50,20,.13);--fill:rgba(30,50,20,.06);--mark:rgba(120,140,40,.25)}
html[data-theme="night"]{--bg:#1b1916;--bg2:#24211d;--card:#24211d;--ink:#ddd3c3;--ink2:#b5aa99;--mute:#857a6c;--line:rgba(255,240,220,.1);--fill:rgba(255,240,220,.06);--mark:rgba(216,176,100,.22);--red:#df7a62;--gold:#d3ad62}
html[data-font="serif"]{--read:var(--serifF)}
html[data-font="sans"]{--read:"Noto Sans TC",var(--sans)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* ============ shell ============ */
.view{min-height:100vh;padding:calc(env(safe-area-inset-top) + 6px) 0 calc(var(--tabh) + env(safe-area-inset-bottom) + 96px)}
.inner{max-width:720px;margin:0 auto;padding:0 22px}
.largetitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 12px}
.largetitle h1{font-size:32px;font-weight:800;letter-spacing:.5px;margin:0;line-height:1.2}
.largetitle .sub{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.tools{display:flex;gap:8px}
.round{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:15px}
.round svg{width:18px;height:18px}
.round:hover{background:var(--line)}

/* progress */
.progress{position:fixed;left:0;top:0;height:3px;width:0;background:var(--red);z-index:60;transition:width .1s linear}

/* tab bar (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.side-head,.side-foot{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute)}
.tab svg{width:25px;height:25px;flex:none}
.tab.on{color:var(--red)}

/* ============ hero ============ */
.hero{border-radius:22px;background:linear-gradient(160deg,#b23a26,#7a2014);color:#fff6e6;padding:24px 24px 22px;position:relative;overflow:hidden;margin:4px 0 8px;box-shadow:0 10px 30px rgba(122,32,20,.22)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:14px solid rgba(246,220,154,.17)}
.hero .k{font-size:12.5px;font-weight:700;letter-spacing:2px;color:#f6dc9a}
.hero h2{font-family:var(--serifF);font-size:clamp(23px,5.6vw,30px);line-height:1.45;margin:10px 0 8px;font-weight:700;position:relative;z-index:1;text-wrap:balance;letter-spacing:.5px}
.hero .src{font-size:13px;opacity:.82;line-height:1.6}
.hero .acts{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:700}
.pill svg{width:16px;height:16px}
.pill.light{background:#fff6e6;color:#8a2618}
.pill.ghost{background:rgba(255,246,230,.16);color:#fff6e6}
.pill:hover{filter:brightness(1.05)}
.readmeta{display:flex;gap:14px;color:var(--mute);font-size:13px;margin:12px 2px 0}

/* ============ reading typography (ebook) ============ */
.read{font-family:var(--read);font-size:var(--fs);line-height:var(--lh);color:var(--ink);
  max-width:34em;margin:0 auto;font-feature-settings:"palt" 0;line-break:strict;word-break:normal;overflow-wrap:anywhere;hanging-punctuation:allow-end;font-kerning:none}
.read p{margin:0 0 .85em;text-align:justify;text-justify:inter-character;text-indent:2em}
.read p.noindent,.box p,.qa .a p,.note p{text-indent:0}
.sec{max-width:34em;margin:2.6em auto 1.1em;display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:3px;color:var(--red);scroll-margin-top:24px}
.sec::before{content:"";width:18px;height:2px;background:var(--red);border-radius:2px}
.sec::after{content:"";flex:1;height:.5px;background:var(--line)}
p.speaking{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.box.speaking,.note.speaking,.vlines.speaking{box-shadow:0 0 0 2px var(--gold) inset;border-radius:12px}
.note.speaking{padding-left:10px;padding-right:10px}
.chapter{max-width:34em;margin:2em auto .4em;text-align:center}
.chapter .orn{color:var(--gold);letter-spacing:8px;font-size:13px}
.verse{background:var(--card);border-radius:18px;padding:20px 20px 6px;margin:0 0 18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(60,40,20,.05)}
.vlabel{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px}
.vlines{font-size:1.22em;font-weight:700;letter-spacing:.18em;line-height:1.9;margin:8px 0 12px;text-indent:0}
.note{border-top:.5px solid var(--line);padding:14px 0 6px}
.note b{display:inline-block;color:var(--red);font-size:.95em;margin-bottom:4px;font-family:var(--sans);font-weight:700}
.note p{color:var(--ink2);font-size:.95em;margin-bottom:.6em}
.box{background:var(--card);border-radius:16px;padding:18px 20px;margin:0 0 14px;box-shadow:0 1px 0 var(--line)}
.box h3{font-family:var(--sans);font-size:15px;margin:0 0 8px;font-weight:800;letter-spacing:.5px}
.box p{margin-bottom:.7em}
.box p:last-child{margin-bottom:0}
.box.accent{border-left:4px solid var(--red)}
details.qa{background:var(--card);border-radius:16px;margin:0 0 10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
details.qa summary{list-style:none;padding:15px 18px;font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"";margin-left:auto;flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-top:6px;transition:.2s}
details.qa[open] summary::after{transform:rotate(-135deg);margin-top:10px}
details.qa .a{padding:0 18px 8px}
details.qa summary:hover{background:var(--fill)}
.srcs{font-family:var(--sans);font-size:13px;color:var(--mute);line-height:1.9}
.pager{max-width:34em;margin:3em auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager button{background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 1px 0 var(--line);min-height:72px}
.pager button:hover{background:var(--fill)}
.pager button.next{text-align:right}
.pager span{display:block;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.pager b{font-family:var(--serifF);font-size:15.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager button[disabled]{opacity:.35;cursor:default}
.endmark{text-align:center;color:var(--gold);margin:2.4em 0 0;letter-spacing:10px}

/* ============ practice in reading ============ */
.hook{max-width:34em;margin:22px auto 4px;font-family:var(--serifF);font-size:calc(var(--fs) * 1.18);line-height:1.7;font-weight:700;color:var(--ink);text-align:center;padding:6px 18px;position:relative;text-wrap:balance}
.hook::before,.hook::after{content:"";display:block;width:36px;height:2px;background:var(--gold);margin:0 auto 12px;border-radius:2px}
.hook::after{margin:12px auto 0}
.todaychip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px 16px;margin:14px 0 0;box-shadow:0 1px 0 var(--line)}
.todaychip:hover{background:var(--fill)}
.todaychip .ic{flex:none;width:38px;height:38px;border-radius:11px;background:#2f6b4a;color:#fff;display:grid;place-items:center}
.todaychip .ic svg{width:20px;height:20px}
.todaychip .tx{flex:1;min-width:0}
.todaychip .tx span{display:block;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:1px}
.todaychip .tx b{display:block;font-size:15.5px;line-height:1.45}
.todaychip.done .ic{background:var(--gold)}
.scn{background:var(--card);border-radius:16px;margin:0 0 12px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.scn h4{margin:0;padding:14px 18px 10px;font-family:var(--sans);font-size:15px;font-weight:800}
.scn .ba{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--line)}
.scn .ba > div{padding:12px 16px 14px}
.scn .ba > div + div{border-left:.5px solid var(--line);background:color-mix(in srgb,#2f6b4a 6%,transparent)}
.scn .ba span{display:block;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:4px;color:var(--mute)}
.scn .ba div + div span{color:#2f6b4a}
.scn .ba p{text-indent:0;margin:0;font-size:.93em;line-height:1.8}
.scn .line{padding:11px 18px;border-top:.5px solid var(--line);font-family:var(--serifF);font-weight:700;color:var(--red);font-size:.98em}
.scn .line::before{content:"當下對自己說：";font-family:var(--sans);font-weight:700;font-size:12px;color:var(--mute);margin-right:6px}
@media (max-width:520px){.scn .ba{grid-template-columns:1fr}.scn .ba > div + div{border-left:none;border-top:.5px solid var(--line)}}
.chal{background:linear-gradient(160deg,#2f6b4a,#1f4a33);color:#f2f7ef;border-radius:20px;padding:20px 20px 18px;margin:0 0 14px}
.chal .k{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:2px;color:#cfe6c9}
.chal h3{font-family:var(--serifF);font-size:1.2em;margin:6px 0 10px;line-height:1.5}
.chal ol{margin:0 0 14px;padding-left:1.3em;font-size:.95em;line-height:1.8}
.chal .acts{display:flex;gap:8px;flex-wrap:wrap}
.chal .acts button{border-radius:999px;padding:9px 15px;font-family:var(--sans);font-size:14px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.chal .acts button.main{background:#fff;color:#1f4a33}
.sharebox{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 0 var(--line)}
.sharebox .txt{font-size:.95em;line-height:1.9;white-space:pre-wrap;color:var(--ink2);max-height:16em;overflow:auto;padding:2px}
.sharebox .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sharebox .btns button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:12px;background:var(--fill);font-family:var(--sans);font-size:13px;font-weight:700}
.sharebox .btns button:hover{background:var(--line)}
.sharebox .btns svg{width:22px;height:22px}
.sharebox .btns .line-btn{background:#06c755;color:#fff}

.dy-theme{background:var(--card);border-radius:16px;padding:18px 20px;margin:0 0 14px;box-shadow:0 1px 0 var(--line);border-left:4px solid var(--gold);font-family:var(--serifF);font-weight:700;font-size:1.08em;line-height:1.75}
.dy-theme span{display:block;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.dy-pts{margin:0;padding-left:1.4em;line-height:1.85}
.dy-pts li{margin-bottom:.4em}
.only-d{display:none}
@media (min-width:900px){.only-d{display:revert}.only-m{display:none!important}}
/* ============ act view ============ */
.streak{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 var(--line);margin-bottom:16px}
.streak .n{font-size:44px;font-weight:800;color:#2f6b4a;line-height:1;font-variant-numeric:tabular-nums}
.streak .l{font-size:13px;color:var(--mute);font-weight:700}
.streak .l b{display:block;font-size:16px;color:var(--ink)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-left:auto;min-width:150px}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--fill);justify-self:center}
.dots i.s1{background:#2f6b4a}.dots i.s2{background:#9cc3a4}.dots i.s3{background:var(--line)}
.dots i.today{outline:2px solid var(--red);outline-offset:1px}
.stepck{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:.5px solid var(--line);width:100%;text-align:left;font-size:15.5px;line-height:1.6}
.stepck:last-child{border-bottom:none}
.stepck .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mute);display:grid;place-items:center;margin-top:1px}
.stepck.on .bx{background:#2f6b4a;border-color:#2f6b4a}
.stepck.on .bx::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stepck.on span{color:var(--mute);text-decoration:line-through}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.status3 button{padding:13px 4px;border-radius:14px;background:var(--fill);font-size:14.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.status3 button i{font-style:normal;font-size:22px}
.status3 button.on{background:#2f6b4a;color:#fff}
.hist .row .date b{color:#2f6b4a}

/* ============ shelf ============ */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:6px 0 26px}
.cover{position:relative;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;color:#fff6e6;padding:16px 14px 14px 20px;text-align:left;overflow:hidden;box-shadow:0 10px 22px rgba(40,20,10,.22),inset 6px 0 0 rgba(0,0,0,.18);display:flex;flex-direction:column;transition:transform .2s}
.cover:hover{transform:translateY(-3px)}
.cover::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:10px solid rgba(255,246,230,.14)}
.cover .nm{font-family:var(--serifF);font-size:22px;font-weight:900;line-height:1.3;letter-spacing:2px}
.cover .tg{font-size:12px;opacity:.85;margin-top:8px;line-height:1.5}
.cover .ct{margin-top:auto;font-size:12px;font-weight:700;opacity:.9}
.cover .bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px;overflow:hidden}
.cover .bar i{display:block;height:100%;background:#f6dc9a}
.cover.on{outline:3px solid var(--ink);outline-offset:3px}
.cover.dim{opacity:.55}

/* ============ toc (desktop right rail) ============ */
.toc{display:none}
.toc a{display:block;padding:6px 12px;border-left:2px solid var(--line);color:var(--mute);text-decoration:none;font-size:13.5px;line-height:1.5}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--red);border-left-color:var(--red);font-weight:700}
.toc .tt{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--mute);margin:0 0 10px 14px}

/* ============ list ============ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--red);color:#fff}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:hover{background:var(--fill)}
.row .date{flex:none;width:44px;text-align:center;line-height:1.15}
.row .date b{display:block;font-size:21px;font-weight:800;color:var(--red)}
.row .date span{font-size:11px;color:var(--mute);font-weight:600}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--serifF);font-size:16.5px;font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12.5px;color:var(--mute)}
.chev{width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);opacity:.6;flex:none}

/* ============ practice ============ */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:4px 0 18px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ctx{font-size:13.5px;color:var(--mute);margin:-4px 0 10px}
.ctx b{color:var(--ink2)}
.cardwrap{border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(60,40,20,.18);background:var(--card)}
.cardwrap canvas{display:block;width:100%;height:auto}
.btnrow{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-size:15.5px;font-weight:700;background:var(--fill)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:18px;height:18px}
.ol{display:grid;gap:10px}
.ol .st{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:15px;box-shadow:0 1px 0 var(--line)}
.ol .badge{flex:none;width:40px;height:40px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serifF);font-weight:900;font-size:19px}
.ol .tm{font-size:12px;color:var(--mute);font-weight:700}
.ol .tx{font-family:var(--read);font-size:15.5px;line-height:1.8}
.timer{display:grid;place-items:center;margin:8px 0 18px}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring .num span{font-size:13px;color:var(--mute);font-weight:600}
.recbtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink2);display:grid;place-items:center;margin:0 auto}
.recbtn i{display:block;width:58px;height:58px;border-radius:50%;background:#e5372b;transition:.25s}
.recbtn.on i{width:28px;height:28px;border-radius:7px}
.lenpick{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.stagehint{text-align:center;font-family:var(--read);font-size:17px;line-height:1.7;min-height:60px;padding:0 10px;color:var(--ink2)}
.stagehint b{color:var(--red)}
.rec{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .play{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.rec .play svg{width:14px;height:14px}
.rec .meta{flex:1;font-size:14px;min-width:0}
.rec .meta span{display:block;font-size:12px;color:var(--mute)}
.rec .ic{width:32px;height:32px;display:grid;place-items:center;color:var(--mute);border-radius:8px}
.rec .ic:hover{background:var(--fill)}
.rec .ic svg{width:19px;height:19px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.check:last-child{border-bottom:none}
.check:hover{background:var(--fill)}
.check .bx{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;margin-top:1px;transition:.15s}
.check.on .bx{background:var(--red);border-color:var(--red)}
.check.on .bx::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check b{display:block;font-size:15.5px;line-height:1.5}
.check span{font-size:13px;color:var(--mute);line-height:1.5}
textarea{width:100%;min-height:110px;border:none;border-radius:14px;background:var(--card);padding:14px;font:inherit;font-size:15.5px;line-height:1.7;color:var(--ink);box-shadow:0 1px 0 var(--line);resize:vertical}
.score{font-size:14px;color:var(--mute);text-align:right;margin:8px 2px 0}
.prac-grid{display:block}

/* ============ settings ============ */
.setrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:.5px solid var(--line);min-height:52px;width:100%;text-align:left;text-decoration:none}
.setrow:last-child{border-bottom:none}
a.setrow:hover,button.setrow:hover{background:var(--fill)}
.setrow .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.setrow .ico svg{width:18px;height:18px}
.setrow .lbl{flex:1;font-size:16px}
.setrow .val{color:var(--mute);font-size:15px}
.gtitle{font-size:13px;color:var(--mute);margin:24px 16px 7px;letter-spacing:.5px}
.gfoot{font-size:13px;color:var(--mute);margin:8px 16px 0;line-height:1.65}

/* reading prefs panel */
.prefs .lab{font-size:13px;color:var(--mute);font-weight:700;letter-spacing:1px;margin:18px 2px 8px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themes button{border-radius:14px;padding:14px 0 10px;border:2px solid transparent;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 0 rgba(0,0,0,.08) inset,0 0 0 1px rgba(0,0,0,.08)}
.themes button i{font-style:normal;font-family:var(--serifF);font-size:22px;font-weight:700}
.themes button.on{border-color:var(--red)}
.opt{display:flex;background:var(--fill);border-radius:12px;padding:3px}
.opt button{flex:1;padding:10px 0;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink2)}
.opt button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sizer{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:12px;padding:6px 8px}
.sizer button{width:44px;height:40px;border-radius:9px;font-family:var(--serifF);font-weight:700}
.sizer button:hover{background:var(--line)}
.sizer input{flex:1;accent-color:var(--red)}
.preview{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--card);font-family:var(--read);font-size:var(--fs);line-height:var(--lh);text-align:justify;text-indent:2em;box-shadow:0 1px 0 var(--line)}
input[type=range]{accent-color:var(--red)}

/* ============ mini player / sheet / toast ============ */
.player{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);z-index:29;max-width:656px;margin:0 auto;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player{flex-direction:column;align-items:stretch;gap:6px}
.prow{display:flex;align-items:center;gap:6px}
.player img{width:40px;height:40px;border-radius:10px;margin-right:6px}
.player .big{width:44px;height:44px;background:var(--red);color:#fff}
.player .big:hover{background:var(--red);filter:brightness(1.08)}
.player .big svg{width:20px;height:20px}
.player .rate{width:auto;min-width:40px;padding:0 6px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink2)}
.pbar{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;padding:0 4px}
.pbar input{flex:1;height:4px;accent-color:var(--red)}
.player.tts .aonly{display:none}
.player .pt{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.player .pt #pSub{color:var(--ink);font-size:14px}
.player .pt span{display:block;font-size:12px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.player button{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.player button:hover{background:var(--fill)}
.player button svg{width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{width:30px;height:30px;border-radius:50%;background:var(--fill);font-size:16px;color:var(--mute)}
.steps{counter-reset:s;display:grid;gap:12px;margin:12px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:15.5px;line-height:1.65}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:13px;background:var(--card)}
.toclist a{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:.5px solid var(--line);text-decoration:none;font-size:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-160%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin:4px 0 16px;box-shadow:0 1px 0 var(--line)}
.banner img{width:42px;height:42px;border-radius:10px}
.banner div{flex:1;font-size:14px;line-height:1.5}
.banner div b{display:block;font-size:15px}
.banner .x{color:var(--mute);font-size:20px;width:28px}
.empty{text-align:center;color:var(--mute);padding:60px 20px;font-size:15px;line-height:1.8}

/* ============ desktop ============ */
@media (min-width: 900px){
  .view{padding:28px 0 120px;margin-left:var(--side)}
  .inner{padding:0 40px;max-width:820px}
  .tabbar{top:0;bottom:auto;right:auto;width:var(--side);height:100vh;flex-direction:column;padding:22px 14px;gap:2px;border-top:none;border-right:.5px solid var(--line);background:var(--bg2);backdrop-filter:none}
  .side-head{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
  .side-head img{width:40px;height:40px;border-radius:10px}
  .side-head b{display:block;font-size:17px;letter-spacing:2px}
  .side-head span{display:block;font-size:12px;color:var(--mute);letter-spacing:1px}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--ink2)}
  .tab svg{width:21px;height:21px}
  .tab:hover{background:var(--fill)}
  .tab.on{background:var(--card);color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .side-foot{display:block;margin-top:auto;padding:10px}
  .side-foot .install{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--red);color:#fff;font-size:14px;font-weight:700}
  .side-foot .install svg{width:18px;height:18px}
  .side-foot .hint{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.6}
  .player{left:calc(var(--side) + 24px);right:24px;bottom:24px}
  .toast{top:20px}
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:520px;border-radius:20px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:.22s;padding:22px 26px 26px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .hero{padding:32px 34px 28px}
  .prac-grid{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:28px;align-items:start}
  .banner{display:none}
}
@media (min-width: 900px){
  #v-read .inner{max-width:740px}
  .read,.sec,.chapter,.pager{max-width:none}
}
@media (min-width: 1280px){
  #v-read .inner{max-width:960px;display:grid;grid-template-columns:minmax(0,680px) 190px;gap:56px;justify-content:center}
  #v-read .inner > .main{min-width:0}
  .toc{display:block;position:sticky;top:40px;align-self:start;margin-top:120px}
  #tocBtn{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.tabbar,.player,.tools,.hero .acts,.pager,.toc,.progress{display:none!important}.view{margin:0;padding:0}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<section class="view" id="v-read"><div class="inner"><div class="main" id="readMain"><div class="empty">正在展開今日的故事…</div></div><nav class="toc" id="toc" aria-label="本則目錄"></nav></div></section>

<section class="view hidden" id="v-list"><div class="inner">
  <div class="largetitle"><div><div class="sub">LIBRARY</div><h1>書架</h1></div></div>
  <div class="shelf" id="shelf"></div>
  <h2 class="sec" style="max-width:none;margin-top:6px" id="listTitle">全部故事</h2>
  <div class="group" id="listGroup"></div>
</div></section>

<section class="view hidden" id="v-act"><div class="inner" id="actInner"></div></section>

<section class="view hidden" id="v-practice"><div class="inner">
  <div class="largetitle"><div><div class="sub">PRACTICE</div><h1>練講</h1></div></div>
  <div class="ctx" id="pCtx"></div>
  <div class="seg" id="pSeg"><button data-p="card" class="on">圖卡</button><button data-p="script">講稿</button><button data-p="rec">練習</button><button data-p="check">自評</button></div>
  <div id="p-card"></div><div id="p-script" class="hidden"></div><div id="p-rec" class="hidden"></div><div id="p-check" class="hidden"></div>
</div></section>

<section class="view hidden" id="v-set"><div class="inner">
  <div class="largetitle"><div><div class="sub">SETTINGS</div><h1>設定</h1></div></div>
  <div class="gtitle">閱讀</div>
  <div class="group">
    <button class="setrow" id="openPrefs"><div class="ico" style="background:#5a4e44"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19 9.5 5h1L16 19M6.2 14h7.6M17 19l2.5-6.5L22 19M18 17h3"/></svg></div><div class="lbl">字體、主題與行距</div><div class="val" id="prefSummary"></div><div class="chev"></div></button>
  </div>
  <div class="gtitle">提醒</div>
  <div class="group">
    <a class="setrow" href="daoyi.ics"><div class="ico" style="background:#e5372b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><div class="lbl"><span class="only-m">加入手機行事曆</span><span class="only-d">加入電腦行事曆</span></div><div class="val">每天 6:30</div><div class="chev"></div></a>
  </div>
  <div class="gfoot">點一下會開啟行事曆，選「加入全部」。建議先新增一個名為「道義」的行事曆，加入時選它，就不會和其他行程混在一起。</div>
  <div class="gtitle">App</div>
  <div class="group">
    <button class="setrow" id="howInstall"><div class="ico" style="background:#a3301f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg></div><div class="lbl"><span class="only-m">加到主畫面</span><span class="only-d">安裝到電腦</span></div><div class="chev"></div></button>
    <button class="setrow" id="refresh"><div class="ico" style="background:#a8822f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></div><div class="lbl">重新整理故事</div><div class="chev"></div></button>
  </div>
  <div class="gfoot"><span class="only-d">快捷鍵：<span class="kbd">←</span> <span class="kbd">→</span> 切換上一則／下一則，<span class="kbd">空白鍵</span> 播放／暫停朗讀。<br></span>每日故事由 Claude 撰寫，經文會先查證原典；解釋僅供參考，請以原典與前賢慈示為準。</div>
</div></section>

<div class="player hidden" id="player">
  <div class="prow">
    <img src="icons/icon-180.png" alt="">
    <div class="pt"><span id="pKind">朗讀中</span><span id="pSub"></span></div>
    <button id="pBack" aria-label="倒退 15 秒" class="aonly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">15</text></svg></button>

</div>

<nav class="tabbar" aria-label="主選單">
  <div class="side-head"><img src="icons/icon-180.png" alt=""><div><b>每日道義</b><span>經典・訓文・練講</span></div></div>

<div class="sheet-bg" id="sheetBg"></div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras = t => (Array.isArray(t) ? t : String(t || "").split(/\n+/)).map(x => String(x).trim()).filter(Boolean);
const P = (arr, cls) => paras(arr).map(x => `<p${cls ? ` class="${cls}"` : ""}>${esc(x)}</p>`).join("");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("dy:"+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("dy:"+k, JSON.stringify(v)); }catch(e){} }
};
const WD = "日一二三四五六";
const fmtDate = d => { const x = new Date(d+"T00:00:00"); return `${x.getMonth()+1}月${x.getDate()}日・星期${WD[x.getDay()]}`; };
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isMacSafari = !isIOS && /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Edg|Firefox/.test(navigator.userAgent);
const isDesktop = () => matchMedia("(min-width: 900px)").matches;

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
function sheet(html){ $("#sheetBody").innerHTML = html; $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on"); $$("#sheetBody [data-close]").forEach(b => b.onclick = closeSheet); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); }
$("#sheetBg").onclick = closeSheet;

/* ---------- reading prefs ---------- */
const THEMES = [["paper","白","#ffffff","#222"],["sepia","米","#f7f2e8","#2e2620"],["green","綠","#e6eedc","#25301f"],["night","夜","#1b1916","#ddd3c3"]];
let prefs = { theme: store.get("theme","auto"), font: store.get("font","serif"), fs: store.get("fs",18), lh: store.get("lh",2) };
let rate = store.get("rate", 0.95);
function applyPrefs(){
  const r = document.documentElement;
  const t = prefs.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "sepia") : prefs.theme;
  r.dataset.theme = t; r.dataset.font = prefs.font;
  r.style.setProperty("--fs", prefs.fs+"px"); r.style.setProperty("--lh", prefs.lh);
  const meta = document.querySelector('meta[name="theme-color"]'); meta.content = getComputedStyle(r).getPropertyValue("--bg").trim() || "#f7f2e8";
  ["theme","font","fs","lh"].forEach(k => store.set(k, prefs[k]));
  const tn = prefs.theme === "auto" ? "自動" : THEMES.find(x => x[0] === prefs.theme)[1];
  $("#prefSummary").textContent = `${tn}・${prefs.font === "serif" ? "明體" : "黑體"}・${prefs.fs}`;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => prefs.theme === "auto" && applyPrefs());
function openPrefs(){
  const lhOpts = [[1.8,"緊湊"],[2,"標準"],[2.25,"寬鬆"]];
  sheet(`<h3>閱讀設定<button class="x" data-close aria-label="關閉">✕</button></h3><div class="prefs">
    <div class="lab">背景</div>
    <div class="themes">${THEMES.map(t => `<button data-t="${t[0]}" style="background:${t[2]};color:${t[3]}" class="${prefs.theme===t[0]?"on":""}"><i>文</i>${t[1]}</button>`).join("")}</div>
    <div class="opt" style="margin-top:10px"><button data-t="auto" class="${prefs.theme==="auto"?"on":""}">跟隨系統（白天米色、晚上夜間）</button></div>
    <div class="lab">字型</div>
    <div class="opt"><button data-f="serif" class="${prefs.font==="serif"?"on":""}" style="font-family:var(--serifF)">明體</button><button data-f="sans" class="${prefs.font==="sans"?"on":""}" style="font-family:'Noto Sans TC',var(--sans)">黑體</button></div>
    <div class="lab">字級</div>
    <div class="sizer"><button data-s="-1" style="font-size:14px" aria-label="縮小">A</button><input type="range" min="15" max="26" step="1" value="${prefs.fs}" id="fsR" aria-label="字級"><button data-s="1" style="font-size:22px" aria-label="放大">A</button></div>
    <div class="lab">行距</div>
    <div class="opt">${lhOpts.map(o => `<button data-l="${o[0]}" class="${prefs.lh==o[0]?"on":""}">${o[1]}</button>`).join("")}</div>
    <div class="preview">須菩提！於意云何？可以身相見如來不？不也，世尊！不可以身相見如來。何以故？如來所說身相，即非身相。</div>
  </div>`);
  const re = () => { applyPrefs(); };
  $$("#sheetBody [data-t]").forEach(b => b.onclick = () => { prefs.theme = b.dataset.t; $$("#sheetBody [data-t]").forEach(x => x.classList.toggle("on", x === b)); re(); });
  $$("#sheetBody [data-f]").forEach(b => b.onclick = () => { prefs.font = b.dataset.f; $$("#sheetBody [data-f]").forEach(x => x.classList.toggle("on", x === b)); re(); });
  $$("#sheetBody [data-l]").forEach(b => b.onclick = () => { prefs.lh = +b.dataset.l; $$("#sheetBody [data-l]").forEach(x => x.classList.toggle("on", x === b)); re(); });
  $("#fsR").oninput = e => { prefs.fs = +e.target.value; re(); };
  $$("#sheetBody [data-s]").forEach(b => b.onclick = () => { prefs.fs = Math.max(15, Math.min(26, prefs.fs + +b.dataset.s)); $("#fsR").value = prefs.fs; re(); });
}
$("#openPrefs").onclick = openPrefs;
applyPrefs();

/* ---------- data ---------- */
let index = [], cache = {}, current = null, topics = [], topicMap = {};
async function loadTopics(){
  try{ const r = await fetch("topics.json"); const j = await r.json(); topics = j.topics || []; topicMap = Object.fromEntries(topics.map(t => [t.id, t])); }catch(e){}
}
async function loadIndex(force){
  const r = await fetch("stories/index.json" + (force ? "?t="+Date.now() : ""), {cache: force ? "reload" : "default"});
  index = (await r.json()).sort((a,b) => a.date < b.date ? 1 : -1);
}
async function getStory(date){
  if(cache[date]) return cache[date];
  const r = await fetch(`stories/${date}.json`);
  return cache[date] = await r.json();
}

/* ---------- routing ---------- */
let view = "read";
function go(v){
  view = v;
  $$(".view").forEach(el => el.classList.toggle("hidden", el.id !== "v-"+v));
  $$(".tab").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if(v === "list") renderList();
  if(v === "act") renderAct();
  if(v === "practice") renderPractice();
  window.scrollTo(0, 0); updateProgress();
}
$$(".tab").forEach(b => b.onclick = () => go(b.dataset.v));
async function openStory(date, scroll){
  if(current && current.date !== date && mode) stopSpeak();
  current = await getStory(date);
  store.set("last", date);
  if(location.hash.replace("#","") !== date) history.replaceState(null, "", "#"+date);
  renderRead();
  if(scroll !== false) window.scrollTo(0, 0);
}

  let n = 0; const add = t => paras(t).forEach(x => n += x.length);
  add(s.story); (s.verses||[]).forEach(v => (v.notes||[]).forEach(x => add(x.text)));
  (s.examples||[]).forEach(x => add(x.text)); (s.deeper||[]).forEach(x => add(x.a));
  add(s.yiguandao); add(s.reflection); add(s.practice); add(s.forTeller);
  if(s.daoyi){ add(s.daoyi.theme); add(s.daoyi.points); add(s.daoyi.opening); add(s.daoyi.bridge); add(s.daoyi.cautions); }
  return n;
}

function jump(id){ const el = document.getElementById(id); if(el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 20, behavior:"smooth"}); }
function updateProgress(){
  const max = document.documentElement.scrollHeight - innerHeight;
  $("#progress").style.width = view === "read" && max > 0 ? (scrollY / max * 100) + "%" : "0";
  if(view === "read" && SECS.length){
    let on = SECS[0][0];
    for(const [id] of SECS){ const el = document.getElementById(id); if(el && el.getBoundingClientRect().top < innerHeight * .35) on = id; }
    $$("#toc a").forEach(a => a.classList.toggle("on", a.dataset.id === on));
  }
}
addEventListener("scroll", updateProgress, {passive:true});
addEventListener("resize", updateProgress);

/* ---------- shelf ---------- */

      <div class="ct">${n ? `${n} 則` : "即將開講"}${t.total ? `・共 ${t.total} ${esc(t.unit)}` : ""}</div>${t.total ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</button>`;
  }).join("");
  $$("#shelf .cover").forEach(b => b.onclick = () => { filter = filter === b.dataset.t ? "all" : b.dataset.t; renderList(); $("#listTitle").scrollIntoView({behavior:"smooth", block:"start"}); });

    const d = new Date(x.date+"T00:00:00");

      <div class="t"><b>${esc(x.title)}</b><span>${esc(x.series||"")}${x.part?"・"+esc(x.part):""}${x.hook ? "｜" + esc(x.hook) : ""}</span></div><div class="chev"></div></button>`;

  $$("#listGroup .row").forEach(b => b.onclick = async () => { await openStory(b.dataset.d); go("read"); });

/* ---------- share ---------- */
function shareText(s, withLink){
  const body = s.share?.text || [s.hook, paras(s.modern?.plain)[0], s.challenge ? "今天試試：" + s.challenge.title : ""].filter(Boolean).join("\n\n");
  const link = location.origin + location.pathname + "#" + s.date;
  return body + (withLink ? `\n\n——每日道義｜${s.title}\n${link}` : "");
}
function shareLine(s){
  const url = "https://line.me/R/share?text=" + encodeURIComponent(shareText(s, true));
  window.open(url, "_blank", "noopener");
}

/* ---------- act (practice in daily life) ---------- */
function actState(date){ return store.get("act:" + date, {status: "", steps: [], note: ""}); }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function streakInfo(){
  const today = new Date(); let n = 0;
  for(let i = 0; i < 400; i++){
    const d = new Date(today); d.setDate(today.getDate() - i);
    const st = actState(ymd(d)).status;
    if(st === "done" || st === "part"){ n++; } else if(i > 0){ break; }
  }
  const days = [];
  for(let i = 27; i >= 0; i--){ const d = new Date(today); d.setDate(today.getDate() - i); days.push({date: ymd(d), st: actState(ymd(d)).status, today: i === 0}); }
  return {n, days};
}
function renderAct(){
  const s = current; if(!s) return;
  const st = actState(s.date), info = streakInfo(), ch = s.challenge;
  let h = `<div class="largetitle"><div><div class="sub">PRACTICE IN LIFE</div><h1>實踐</h1></div></div>
    <div class="streak"><div class="n">${info.n}</div><div class="l"><b>天連續實踐</b>做到一部分也算數</div>
    <div class="dots" aria-label="近四週">${info.days.map(d => `<i class="${d.st==="done"?"s1":d.st==="part"?"s2":d.st==="skip"?"s3":""} ${d.today?"today":""}" title="${d.date}"></i>`).join("")}</div></div>`;
  if(!ch){ h += `<div class="empty">這則沒有實踐挑戰，回到「今日」看看最新一則吧。</div>`; $("#actInner").innerHTML = h; return; }
  h += `<div class="ctx">來自：<b>${esc(s.title)}</b></div>

function wrapText(ctx, text, maxW){
  const out = []; let line = "";
  for(const ch of String(text)){
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line){
      if(/^[，。、；：！？」』）…—]$/.test(ch)){ line = test; continue; }
      out.push(line); line = ch;
    } else line = test;
  }
  if(line) out.push(line);
  return out;
}

    <div class="lenpick">${[1,3,5,10].map(m => `<button class="chip ${m===targetMin?"on":""}" data-m="${m}">${m} 分鐘</button>`).join("")}</div></div>
    <div><div class="sec" style="max-width:none">我的錄音</div><div class="group" id="recList"><div class="empty" style="padding:24px">還沒有錄音</div></div>
    <div class="gfoot" style="margin:10px 4px">想要更具體的回饋？按錄音旁的${isDesktop() ? "下載" : "分享"}，把檔案傳到 Claude，貼上「自評」頁裡的提示詞，就能得到逐段建議。錄音只存在這台裝置裡。</div></div></div>`;
  $$(".lenpick .chip").forEach(b => b.onclick = () => { if(rec) return; targetMin = +b.dataset.m; renderRec(); });
  $("#recBtn").onclick = () => rec ? stopRec() : startRec();
  listRecs();
}
async function startRec(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast("這個瀏覽器不支援錄音"); return; }
  let stream; try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("需要允許使用麥克風"); return; }
  const type = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined); recChunks = [];
  rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const dur = (Date.now() - recStart) / 1000, blob = new Blob(recChunks, {type: rec.mimeType || type || "audio/mp4"}); rec = null;
    await idb.put({ id: Date.now(), date: current.date, title: current.title, dur, blob, type: blob.type });
    toast(`已存檔・${mmss(dur)}`); listRecs();
  };
  rec.start(); recStart = Date.now(); $("#recBtn").classList.add("on"); stopSpeak();
  const t = talkOf(current), total = targetMin * 60, arc = $("#arc");
  recTimer = setInterval(() => {
    const sec = (Date.now() - recStart) / 1000; $("#tNum").textContent = mmss(sec);
    arc.style.strokeDashoffset = 678.6 * (1 - Math.min(1, sec/total));
    arc.style.stroke = sec > total ? "#e5372b" : sec > total*0.85 ? "var(--gold)" : "var(--red)";
    $("#tSub").textContent = sec > total ? `超時 ${mmss(sec-total)}` : `剩 ${mmss(total-sec)}`;
    const st = stageAt(sec, t); if(st) $("#stageHint").innerHTML = `<b>${esc(st.stage)}</b>｜${esc(st.text)}`;
  }, 250);
}
function stopRec(){ clearInterval(recTimer); $("#recBtn")?.classList.remove("on"); try{ rec.stop(); }catch(e){} }
async function listRecs(){
  let all = []; try{ all = (await idb.all()).sort((a,b) => b.id - a.id); }catch(e){}
  const el = $("#recList"); if(!el) return;
  if(!all.length){ el.innerHTML = `<div class="empty" style="padding:24px">還沒有錄音</div>`; return; }
  el.innerHTML = all.map(r => { const d = new Date(r.id); return `<div class="rec" data-id="${r.id}">
    <button class="play" data-a="play" aria-label="播放">${ICON_PLAY}</button>
    <div class="meta">${esc(r.title)}<span>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}・${mmss(r.dur)}</span></div>
    <button class="ic" data-a="share" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v13M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button class="ic" data-a="del" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`; }).join("");
  $$("#recList .rec").forEach(row => {
    const r = all.find(x => String(x.id) === row.dataset.id);
    row.querySelector('[data-a="play"]').onclick = e => {
      const btn = e.currentTarget;
      if(audioEl && audioEl._id === r.id && !audioEl.paused){ audioEl.pause(); btn.innerHTML = ICON_PLAY; return; }
      if(audioEl) audioEl.pause();
      $$("#recList .play").forEach(b => b.innerHTML = ICON_PLAY);
      audioEl = new Audio(URL.createObjectURL(r.blob)); audioEl._id = r.id; audioEl.play().catch(()=>{});
      btn.innerHTML = ICON_PAUSE; audioEl.onended = () => btn.innerHTML = ICON_PLAY;
    };
    row.querySelector('[data-a="share"]').onclick = async () => {
      const ext = /webm/.test(r.type) ? "webm" : "m4a", file = new File([r.blob], `練講-${r.date}-${r.id}.${ext}`, {type: r.type});
      try{ if(!isDesktop() && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]}); else { const a = document.createElement("a"); a.href = URL.createObjectURL(r.blob); a.download = file.name; a.click(); } }catch(e){}
    };
    row.querySelector('[data-a="del"]').onclick = async () => { await idb.del(r.id); listRecs(); toast("已刪除"); };
  });
}
const CHECKS = [
  ["開場 30 秒內抓住注意", "用問題、畫面或故事，而不是「今天要講的是…」"],
  ["故事講得出場景與人物", "有時間、地點、對話，聽的人看得到畫面"],
  ["經文有逐句講清楚", "比喻是什麼、為什麼這樣比喻"],
  ["經文出處講得正確", "引用原文、不加自己的比喻，忠於經義"],
  ["連回求道人自身", "一句平實的話，讓人知道「這跟我有關」"],
  ["用詞初機者聽得懂", "佛學名詞、人名有白話解釋，不一次丟太多"],
  ["結尾留下一句帶走的話", "短、好記，回家還記得"],
  ["時間控制在目標內", "語速穩、有停頓，不趕不拖"]
];
function renderCheck(){
  const key = "check:" + current.date, st = store.get(key, {on: [], note: ""});
  $("#p-check").innerHTML = `<div class="prac-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div><div class="group">` + CHECKS.map((c,i) => `<button class="check ${st.on.includes(i)?"on":""}" data-i="${i}"><div class="bx"></div><div><b>${c[0]}</b><span>${c[1]}</span></div></button>`).join("") + `</div>
    <div class="score" id="score"></div></div><div>
    <div class="sec" style="margin-top:4px;max-width:none">這次想改進的地方</div><textarea id="note" placeholder="例如：轉折太突然、例子可以換成…">${esc(st.note)}</textarea>
    <div class="sec" style="max-width:none">請 Claude 給回饋</div>
    <div class="box"><p style="font-size:15px;margin-bottom:12px">把錄音（或講稿）傳到 Claude，貼上這段提示詞：</p>
    <button class="btn primary" id="copyPrompt" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>複製回饋提示詞</button></div></div></div>`;
  const upd = () => { $("#score").textContent = `完成 ${st.on.length} / ${CHECKS.length}`; store.set(key, st); };
  $$("#p-check .check").forEach(b => b.onclick = () => { const i = +b.dataset.i; st.on = st.on.includes(i) ? st.on.filter(x => x!==i) : [...st.on, i]; b.classList.toggle("on"); upd(); });
  $("#note").oninput = e => { st.note = e.target.value; store.set(key, st); };
  $("#copyPrompt").onclick = async () => {
    const p = `我在練講一貫道道義，主題是「${current.title}」（${current.source||""}），目標 ${talkOf(current).minutes||3} 分鐘，對象是剛求道的新道親。附上我的練講錄音／講稿。請你：\n1. 先模擬一位剛求道的人，說出聽完的真實感受（哪裡被打動、哪裡聽不懂、哪裡走神）。\n2. 依「開場、故事、經文解釋、生活例子、連回自身、結尾、時間語速」逐項給分（1–5）與具體修改建議。\n3. 指出經文或義理上有沒有講錯、講得不精確的地方。\n4. 給我一個改寫後更好的開場和結尾範例。\n我自己覺得要改進的：${st.note || "（無）"}`;
    try{ await navigator.clipboard.writeText(p); toast("已複製，貼到 Claude 即可"); }catch(e){ toast("複製失敗"); }
  };
  upd();
}

/* ---------- install ---------- */
let deferredPrompt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; $("#installBtn").classList.remove("hidden"); $("#installHint").textContent = "安裝後會出現在桌面、開始選單或 Dock，可以釘選到工具列。"; });
addEventListener("appinstalled", () => { deferredPrompt = null; $("#installBtn").classList.add("hidden"); $("#installHint").textContent = ""; toast("已安裝 🙏"); });
$("#installBtn").onclick = async () => { if(!deferredPrompt) return showInstall(); deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
if(isDesktop() && !isStandalone){
  setTimeout(() => { if(!deferredPrompt){ $("#installHint").innerHTML = isMacSafari ? "Safari：選單「檔案」→「加入 Dock」，就能像 App 一樣從 Dock 打開。" : `<a href="#" id="hintLink" style="color:var(--red);font-weight:700;text-decoration:none">如何安裝到電腦 ›</a>`; const l = $("#hintLink"); if(l) l.onclick = e => { e.preventDefault(); showInstall(); }; } }, 1500);
}
function showInstall(){
  if(isDesktop()){
    const mac = /Macintosh/.test(navigator.userAgent), safari = isMacSafari, edge = /Edg\//.test(navigator.userAgent);
    let body;
    if(mac && safari) body = `<ol class="steps"><li>點螢幕上方選單列的「檔案」</li><li>選「加入 Dock」，再按「加入」</li><li>Dock 會出現「每日道義」，之後點它就能直接打開</li></ol>`;
    else if(mac) body = `<ol class="steps"><li>點網址列最右邊的「安裝」圖示 <span class="kbd">⊕</span></li><li>按「安裝」，會開成獨立視窗</li><li>在 Dock 的圖示上按右鍵 →「選項」→「保留在 Dock」</li></ol>`;
    else body = `<ol class="steps"><li>點網址列最右邊的「安裝」圖示 <span class="kbd">⊕</span>${edge ? "（或右上角「⋯」→「應用程式」→「將此網站安裝為應用程式」）" : "（或右上角「⋮」→「投放、儲存與分享」→「將網頁安裝為應用程式」）"}</li><li>按「安裝」，會開成獨立視窗，並加到桌面和開始功能表</li><li>在工作列的圖示上按右鍵 →「釘選到工作列」</li></ol>`;
    sheet(`<h3>安裝到電腦<button class="x" data-close aria-label="關閉">✕</button></h3>${body}
      <p class="gfoot" style="margin:16px 0 0">只想放在書籤列：按 <span class="kbd">${mac ? "⌘" : "Ctrl"}</span>＋<span class="kbd">D</span>，位置選「書籤列」。</p>`);
  } else {
    sheet(isIOS ? `<h3>加到主畫面<button class="x" data-close aria-label="關閉">✕</button></h3><ol class="steps">
        <li>用 <b>Safari</b> 打開這個網頁（LINE 等 App 內建的瀏覽器不行）</li>
        <li>點下方的「分享」按鈕 <span class="kbd">↑</span></li>
        <li>往下滑，選「<b>加入主畫面</b>」</li>
        <li>名稱已經是「每日道義」，按右上角「加入」</li></ol>
        <p class="gfoot" style="margin:16px 0 0">之後從主畫面打開會是全螢幕，看過的故事也能離線閱讀。</p>`
      : `<h3>加到主畫面<button class="x" data-close aria-label="關閉">✕</button></h3><ol class="steps"><li>用 Chrome 打開這個網頁</li><li>點右上角「⋮」選單</li><li>選「<b>加到主畫面</b>」或「安裝應用程式」</li></ol>`);
  }
}
$("#howInstall").onclick = () => deferredPrompt ? $("#installBtn").click() : showInstall();
$("#refresh").onclick = async () => { await boot(true); toast("已更新"); go("read"); };

/* ---------- boot ---------- */
async function boot(force){
  try{
    await Promise.all([loadIndex(force), topics.length ? null : loadTopics()]);
    if(!index.length){ $("#readMain").innerHTML = `<div class="empty">第一則故事正在準備中</div>`; return; }
    if(force) cache = {};
    const h = location.hash.replace("#", "");
    await openStory(index.find(x => x.date === h) ? h : index[0].date);
    const v = new URLSearchParams(location.search).get("v");
    if(["list","practice","set","act"].includes(v)) go(v);
  }catch(e){
    $("#readMain").innerHTML = `<div class="empty">讀不到故事，請確認網路後重新整理。</div>`;
  }
}
boot(false);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && index.length){ const before = index[0]?.date; loadIndex(true).then(() => { if(index[0]?.date !== before){ openStory(index[0].date); toast("今天的故事來了"); } }).catch(()=>{}); } });
})();
</script>
