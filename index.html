<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日道義">
<meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<meta name="description" content="每天一則經典、訓文故事，附逐句細解與練講工具。">
<title>每日道義</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --bg2:#efe7d6; --card:#fffdf8; --ink:#2a231e; --ink2:#5d5148; --mute:#968878;
  --red:#a3301f; --red2:#c2492f; --gold:#b48a35; --line:rgba(60,40,20,.12); --fill:rgba(60,40,20,.06);
  --fs:18px; --tabh:56px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1a1714;--bg2:#24201b;--card:#221e1a;--ink:#efe6d6;--ink2:#cbbfae;--mute:#968a7a;--red:#e0735c;--red2:#e88a74;--gold:#d8b064;--line:rgba(255,240,220,.12);--fill:rgba(255,240,220,.07);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:inherit}
.hidden{display:none!important}

/* layout */
.view{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(var(--tabh) + env(safe-area-inset-bottom) + 90px)}
.inner{max-width:680px;margin:0 auto;padding:0 20px}
.largetitle{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 10px}
.largetitle h1{font-size:32px;font-weight:800;letter-spacing:.5px;margin:0}
.largetitle .sub{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.5px;margin-bottom:2px}
.round{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.round svg{width:18px;height:18px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute)}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--red)}

/* hero */
.hero{border-radius:22px;background:linear-gradient(160deg,#b23a26,#7a2014);color:#fff6e6;padding:22px 22px 20px;position:relative;overflow:hidden;margin:6px 0 22px;box-shadow:0 10px 30px rgba(122,32,20,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:14px solid rgba(246,220,154,.18)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:2px;color:#f6dc9a;opacity:.95}
.hero h2{font-family:var(--serif);font-size:26px;line-height:1.4;margin:8px 0 6px;font-weight:700;position:relative;z-index:1}
.hero .src{font-size:12.5px;opacity:.8}
.hero .acts{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700}
.pill svg{width:16px;height:16px}
.pill.light{background:#fff6e6;color:#8a2618}
.pill.ghost{background:rgba(255,246,230,.16);color:#fff6e6}

/* reading */
.read{font-family:var(--serif);font-size:var(--fs);line-height:1.95}
.read p{margin:0 0 1em;text-align:justify}
.sec{margin:34px 0 14px;display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:2px;color:var(--red)}
.sec::after{content:"";flex:1;height:.5px;background:var(--line)}
.story p:first-child::first-letter{font-size:2.3em;float:left;line-height:1;margin:5px 8px 0 0;color:var(--red);font-weight:900}
p.speaking{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--gold) 30%,transparent) 58%)}
.verse{background:var(--card);border-radius:18px;padding:18px 18px 4px;margin-bottom:16px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(60,40,20,.05)}
.vlabel{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px}
.vlines{font-size:1.25em;font-weight:700;letter-spacing:3px;line-height:1.85;margin:6px 0 10px}
.note{border-top:.5px solid var(--line);padding:12px 0}
.note b{color:var(--red);display:block;font-size:.95em}
.note div{color:var(--ink2);font-size:.93em}
.box{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.box h3{font-family:var(--sans);font-size:15px;margin:0 0 6px;font-weight:800}
.box p:last-child{margin-bottom:0}
.box.accent{border-left:4px solid var(--red)}
details.qa{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
details.qa summary{list-style:none;padding:14px 16px;font-family:var(--sans);font-weight:700;font-size:15.5px;display:flex;gap:10px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"";margin-left:auto;flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-top:6px;transition:.2s}
details.qa[open] summary::after{transform:rotate(-135deg);margin-top:10px}
details.qa .a{padding:0 16px 6px}
.srcs{font-size:13px;color:var(--mute);line-height:1.9}

/* list */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--red);color:#fff}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .date{flex:none;width:44px;text-align:center;line-height:1.1}
.row .date b{display:block;font-size:20px;font-weight:800;color:var(--red)}
.row .date span{font-size:11px;color:var(--mute);font-weight:600}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12.5px;color:var(--mute)}
.chev{width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);opacity:.6;flex:none}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:4px 0 18px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ctx{font-size:13px;color:var(--mute);margin:-4px 0 10px}
.ctx b{color:var(--ink2)}

/* card canvas */
.cardwrap{border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(60,40,20,.18);background:var(--card)}
.cardwrap canvas{display:block;width:100%;height:auto}
.btnrow{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-size:15.5px;font-weight:700;background:var(--fill)}
.btn.primary{background:var(--red);color:#fff}
.btn svg{width:18px;height:18px}

/* outline */
.ol{display:grid;gap:10px}
.ol .st{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--line)}
.ol .badge{flex:none;width:38px;height:38px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px}
.ol .tm{font-size:12px;color:var(--mute);font-weight:700}
.ol .tx{font-size:15px;line-height:1.7}

/* practice */
.timer{display:grid;place-items:center;margin:8px 0 18px}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring .num span{font-size:13px;color:var(--mute);font-weight:600}
.recbtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink2);display:grid;place-items:center;margin:0 auto}
.recbtn i{display:block;width:58px;height:58px;border-radius:50%;background:#e5372b;transition:.25s}
.recbtn.on i{width:28px;height:28px;border-radius:7px}
.lenpick{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.stagehint{text-align:center;font-family:var(--serif);font-size:17px;min-height:56px;padding:0 10px;color:var(--ink2)}
.stagehint b{color:var(--red)}
.rec{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .play{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.rec .play svg{width:14px;height:14px}
.rec .meta{flex:1;font-size:14px}
.rec .meta span{display:block;font-size:12px;color:var(--mute)}
.rec .ic{width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}
.rec .ic svg{width:19px;height:19px}

/* self check */
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.check:last-child{border-bottom:none}
.check .bx{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;margin-top:1px;transition:.15s}
.check.on .bx{background:var(--red);border-color:var(--red)}
.check.on .bx::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check b{display:block;font-size:15.5px}
.check span{font-size:13px;color:var(--mute)}
textarea{width:100%;min-height:110px;border:none;border-radius:14px;background:var(--card);padding:14px;font:inherit;font-size:15.5px;color:var(--ink);box-shadow:0 1px 0 var(--line);resize:vertical}
.score{font-size:14px;color:var(--mute);text-align:right;margin:8px 2px 0}

/* settings */
.setrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:.5px solid var(--line);min-height:52px;width:100%;text-align:left;text-decoration:none}
.setrow:last-child{border-bottom:none}
.setrow .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.setrow .ico svg{width:18px;height:18px}
.setrow .lbl{flex:1;font-size:16px}
.setrow .val{color:var(--mute);font-size:15px}
.gtitle{font-size:13px;color:var(--mute);margin:24px 16px 7px;letter-spacing:.5px}
.gfoot{font-size:13px;color:var(--mute);margin:8px 16px 0;line-height:1.6}
input[type=range]{width:100%;accent-color:var(--red)}

/* mini player */
.player{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);z-index:29;max-width:656px;margin:0 auto;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player img{width:40px;height:40px;border-radius:10px}
.player .pt{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pt span{display:block;font-size:12px;color:var(--mute);font-weight:500}
.player button{width:38px;height:38px;display:grid;place-items:center}
.player button svg{width:22px;height:22px}

/* sheet & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.3s cubic-bezier(.2,.8,.2,1);max-width:680px;margin:0 auto;max-height:86vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin:0 0 12px}
.steps{counter-reset:s;display:grid;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:15.5px;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin:4px 0 16px;box-shadow:0 1px 0 var(--line)}
.banner img{width:42px;height:42px;border-radius:10px}
.banner div{flex:1;font-size:14px;line-height:1.45}
.banner div b{display:block;font-size:15px}
.banner .x{color:var(--mute);font-size:20px;width:28px}
.empty{text-align:center;color:var(--mute);padding:60px 20px;font-size:15px}
</style>
</head>
<body>

<!-- 今日 / 閱讀 -->
<section class="view" id="v-read"><div class="inner" id="readInner"><div class="empty">正在展開今日的故事…</div></div></section>

<!-- 往期 -->
<section class="view hidden" id="v-list"><div class="inner">
  <div class="largetitle"><div><div class="sub">ARCHIVE</div><h1>往期</h1></div></div>
  <div class="chips" id="chips"></div>
  <div class="group" id="listGroup"></div>
</div></section>

<!-- 練講 -->
<section class="view hidden" id="v-practice"><div class="inner">
  <div class="largetitle"><div><div class="sub">PRACTICE</div><h1>練講</h1></div></div>
  <div class="ctx" id="pCtx"></div>
  <div class="seg" id="pSeg">
    <button data-p="card" class="on">圖卡</button><button data-p="script">講稿</button><button data-p="rec">練習</button><button data-p="check">自評</button>
  </div>
  <div id="p-card"></div>
  <div id="p-script" class="hidden"></div>
  <div id="p-rec" class="hidden"></div>
  <div id="p-check" class="hidden"></div>
</div></section>

<!-- 設定 -->
<section class="view hidden" id="v-set"><div class="inner">
  <div class="largetitle"><div><div class="sub">SETTINGS</div><h1>設定</h1></div></div>
  <div class="gtitle">閱讀</div>
  <div class="group">
    <div class="setrow" style="flex-wrap:wrap"><div class="lbl">字體大小</div><div class="val" id="fsVal"></div><input type="range" id="fsRange" min="15" max="26" step="1"></div>
    <div class="setrow" style="flex-wrap:wrap"><div class="lbl">朗讀速度</div><div class="val" id="rateVal"></div><input type="range" id="rateRange" min="0.6" max="1.3" step="0.05"></div>
  </div>
  <div class="gtitle">提醒</div>
  <div class="group">
    <a class="setrow" href="daoyi.ics"><div class="ico" style="background:#e5372b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><div class="lbl">加入 iPhone 行事曆</div><div class="val">每天 6:30</div><div class="chev"></div></a>
  </div>
  <div class="gfoot">點一下會開啟行事曆，選「加入全部」。建議先在行事曆 App 新增一個名為「道義」的行事曆，加入時選它，就不會和其他行程混在一起。</div>
  <div class="gtitle">App</div>
  <div class="group">
    <button class="setrow" id="howInstall"><div class="ico" style="background:#a3301f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg></div><div class="lbl">加到主畫面</div><div class="chev"></div></button>
    <button class="setrow" id="refresh"><div class="ico" style="background:#b48a35"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></div><div class="lbl">重新整理故事</div><div class="chev"></div></button>
  </div>
  <div class="gfoot">每日故事由 Claude 撰寫，經文會先查證原典；解釋僅供參考，請以原典與前賢慈示為準。</div>
</div></section>

<!-- mini player -->
<div class="player hidden" id="player">
  <img src="icons/icon-180.png" alt="">
  <div class="pt" id="pTitle">朗讀中<span id="pSub"></span></div>
  <button id="pToggle" aria-label="暫停"></button>
  <button id="pStop" aria-label="停止"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
</div>

<nav class="tabbar">
  <button class="tab on" data-v="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z"/><path d="M12 6.5v13"/></svg>今日</button>
  <button class="tab" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>往期</button>
  <button class="tab" data-v="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>練講</button>
  <button class="tab" data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>設定</button>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

/* ---------- settings ---------- */
let fs = store.get("fs", 18), rate = store.get("rate", 0.95);

/* ---------- data ---------- */

async function loadIndex(force){

async function getStory(date){

/* ---------- read view ---------- */

    <button class="pill ghost" id="toPractice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/></svg>練講</button></div></div>`;

    $("#bannerX").onclick = () => { store.set("bannerX", true); $("#banner").remove(); };

/* ---------- speech ---------- */
let speaking = false, paused = false, voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /zh[-_]TW/i.test(v.lang) && /Mei|美佳|Premium|Enhanced/i.test(v.name)) || vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh[-_]HK/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function markPara(i){ $$(".story p").forEach(p => p.classList.toggle("speaking", +p.dataset.i === i)); }
function speakStory(){
  if(!("speechSynthesis" in window)){ toast("這個瀏覽器不支援朗讀"); return; }
  stopSpeak();
  const s = current, lines = [{t: s.title, i: -1}];
  paras(s.story).forEach((p,i) => lines.push({t:p, i}));
  (s.verses||[]).forEach(v => { lines.push({t:(v.label||"")+"。"+(v.lines||[]).join(""), i:-1}); (v.notes||[]).forEach(n => lines.push({t:n.term+"。"+paras(n.text).join(""), i:-1})); });
  speaking = true; paused = false;
  $("#player").classList.remove("hidden"); $("#pSub").textContent = s.title; $("#pToggle").innerHTML = ICON_PAUSE;
  let k = 0;
  const next = () => {
    if(!speaking) return;
    if(k >= lines.length){ stopSpeak(); toast("聽完了 🙏"); return; }
    const L = lines[k++], u = new SpeechSynthesisUtterance(L.t);
    u.lang = "zh-TW"; if(voice) u.voice = voice; u.rate = rate;
    u.onstart = () => { markPara(L.i); if(L.i >= 0 && view === "read"){ const el = $(`.story p[data-i="${L.i}"]`); el && el.scrollIntoView({behavior:"smooth", block:"center"}); } };
    u.onend = next; u.onerror = e => { if(e.error !== "interrupted" && e.error !== "canceled") next(); };
    speechSynthesis.speak(u);
  };
  next();
}
function stopSpeak(){ speaking = false; paused = false; try{ speechSynthesis.cancel(); }catch(e){} $("#player").classList.add("hidden"); markPara(-9); }
$("#pStop").onclick = stopSpeak;
$("#pToggle").onclick = () => {
  if(!speaking) return;
  if(paused){ speechSynthesis.resume(); paused = false; $("#pToggle").innerHTML = ICON_PAUSE; }
  else { speechSynthesis.pause(); paused = true; $("#pToggle").innerHTML = ICON_PLAY; }
};

  return s.card || { kicker: s.series || "每日道義", headline: s.title, sub: s.source || "", points: (s.examples||[]).slice(0,3).map(x => x.title), closing: paras(s.reflection)[0] || "" };

/* card */
const logoImg = new Image(); logoImg.src = "icons/icon-180.png";
function wrapText(ctx, text, maxW){
  const out = []; let line = "";
  for(const ch of String(text)){
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line){
      if(/^[，。、；：！？」』）]$/.test(ch)){ line = test; continue; }
      out.push(line); line = ch;
    } else line = test;
  }
  if(line) out.push(line);
  return out;
}
async function drawCard(canvas, s){
  const c = cardOf(s), W = 1080, H = 1350, ctx = canvas.getContext("2d");
  canvas.width = W; canvas.height = H;
  try{ await document.fonts.load('700 60px "Noto Serif TC"'); await document.fonts.load('900 60px "Noto Serif TC"'); }catch(e){}
  if(!logoImg.complete) await new Promise(r => { logoImg.onload = r; logoImg.onerror = r; });
  const serif = '"Noto Serif TC","Songti TC",serif', sans = '-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
  // paper
  ctx.fillStyle = "#f7f2e8"; ctx.fillRect(0,0,W,H);
  // top band
  const g = ctx.createLinearGradient(0,0,0,520); g.addColorStop(0,"#b23a26"); g.addColorStop(1,"#7a2014");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,520);
  ctx.strokeStyle = "rgba(246,220,154,.18)"; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(W-90, 70, 230, 0, Math.PI*2); ctx.stroke();
  ctx.drawImage(logoImg, 80, 78, 84, 84);
  ctx.fillStyle = "#f6dc9a"; ctx.font = `700 30px ${sans}`; ctx.textBaseline = "middle";
  ctx.fillText(c.kicker || "", 186, 120);
  ctx.fillStyle = "#fff6e6"; ctx.textBaseline = "alphabetic";
  let fsH = 112; ctx.font = `900 ${fsH}px ${serif}`;
  while(ctx.measureText(c.headline).width > W-160 && fsH > 64){ fsH -= 6; ctx.font = `900 ${fsH}px ${serif}`; }
  const hl = wrapText(ctx, c.headline, W-160).slice(0,2);
  let y = hl.length > 1 ? 300 : 340;
  hl.forEach(l => { ctx.fillText(l, 80, y); y += fsH * 1.2; });
  ctx.font = `600 40px ${serif}`; ctx.fillStyle = "rgba(255,246,230,.88)";
  wrapText(ctx, c.sub || "", W-160).slice(0,1).forEach(l => ctx.fillText(l, 80, 452));
  // points
  y = 620;
  (c.points || []).slice(0,3).forEach((p, i) => {
    ctx.fillStyle = "#a3301f"; ctx.beginPath(); ctx.arc(108, y-14, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `800 30px ${sans}`; ctx.textAlign = "center"; ctx.fillText(String(i+1), 108, y-3); ctx.textAlign = "left";
    ctx.fillStyle = "#2a231e"; ctx.font = `600 42px ${serif}`;
    const ls = wrapText(ctx, p, W-240).slice(0,3);
    ls.forEach((l, j) => ctx.fillText(l, 160, y + j*62));
    y += ls.length * 62 + 52;
  });
  // closing
  if(c.closing){
    const cy = Math.max(y + 10, 1060);
    ctx.fillStyle = "#b48a35"; ctx.fillRect(80, cy-46, 6, 100);
    ctx.fillStyle = "#7a2014"; ctx.font = `700 40px ${serif}`;
    wrapText(ctx, c.closing, W-200).slice(0,2).forEach((l, j) => ctx.fillText(l, 112, cy + j*56));
  }
  // footer
  ctx.fillStyle = "rgba(42,35,30,.12)"; ctx.fillRect(80, H-120, W-160, 2);
  ctx.fillStyle = "#968878"; ctx.font = `600 28px ${sans}`;
  ctx.fillText("每日道義", 80, H-66);
  ctx.textAlign = "right"; ctx.fillText(s.date.replaceAll("-", "."), W-80, H-66); ctx.textAlign = "left";
}
async function renderCard(){
  const box = $("#p-card");
  box.innerHTML = `<div class="cardwrap"><canvas id="cv"></canvas></div>
    <div class="btnrow"><button class="btn primary" id="cvShare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v13M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>分享 / 儲存圖片</button></div>
    <div class="gfoot" style="margin:0 4px">1080×1350（Instagram、LINE 直式比例）。在 iPhone 上按「分享」後選「儲存影像」即可存到相簿。</div>`;
  const cv = $("#cv"); await drawCard(cv, current);
  $("#cvShare").onclick = () => cv.toBlob(async blob => {
    const file = new File([blob], `每日道義-${current.date}.png`, {type:"image/png"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title: current.title});
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
    }catch(e){}
  }, "image/png");
}

/* script */
function renderScript(){
  const t = talkOf(current);
  let h = `<div class="sec" style="margin-top:4px">${t.minutes || 3} 分鐘架構</div><div class="ol">` +
    (t.outline||[]).map(o => `<div class="st"><div class="badge">${esc(o.stage)}</div><div><div class="tm">${esc(o.time||"")}</div><div class="tx">${esc(o.text)}</div></div></div>`).join("") + `</div>`;
  if(t.script) h += `<div class="sec">示範講稿</div><div class="box read">${P(t.script)}</div><div class="btnrow"><button class="btn" id="readScript"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>聽示範</button><button class="btn" id="copyScript"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>複製講稿</button></div>`;
  if(t.questions?.length) h += `<div class="sec">求道人可能會問</div>` + t.questions.map(q => `<details class="qa"><summary>${esc(q.q)}</summary><div class="a read" style="font-size:16px">${P(q.a)}</div></details>`).join("");
  if(t.pitfalls?.length) h += `<div class="sec">容易講錯的地方</div><div class="box">` + t.pitfalls.map(p => `<p>⚠︎ ${esc(p)}</p>`).join("") + `</div>`;
  $("#p-script").innerHTML = h;
  if($("#copyScript")) $("#copyScript").onclick = async () => { try{ await navigator.clipboard.writeText(paras(t.script).join("\n")); toast("已複製講稿"); }catch(e){ toast("複製失敗"); } };
  if($("#readScript")) $("#readScript").onclick = () => {
    stopSpeak(); speaking = true; $("#player").classList.remove("hidden"); $("#pSub").textContent = "示範講稿"; $("#pToggle").innerHTML = ICON_PAUSE;

    const next = () => { if(!speaking) return; if(k >= ls.length) return stopSpeak(); const u = new SpeechSynthesisUtterance(ls[k++]); u.lang = "zh-TW"; if(voice) u.voice = voice; u.rate = rate; u.onend = next; speechSynthesis.speak(u); };
    next();
  };
}

/* recording (IndexedDB) */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("daoyi", 1); r.onupgradeneeded = () => r.result.createObjectStore("recs", {keyPath:"id"}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("recs", mode); const st = t.objectStore("recs"); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return { put: r => tx("readwrite", st => st.put(r)), del: id => tx("readwrite", st => st.delete(id)), all: () => tx("readonly", st => st.getAll()) };
})();
let rec = null, recChunks = [], recStart = 0, recTimer = null, targetMin = null, audioEl = null;
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function stageAt(sec, t){
  const total = (targetMin || t.minutes || 3) * 60, ol = t.outline || [], n = ol.length || 1;
  const i = Math.min(n-1, Math.floor(sec / (total / n)));
  return ol[i];
}
async function renderRec(){
  const t = talkOf(current); if(targetMin == null) targetMin = t.minutes || 3;
  const box = $("#p-rec");
  box.innerHTML = `
    <div class="timer"><div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--fill)" stroke-width="12"/><circle id="arc" cx="120" cy="120" r="108" fill="none" stroke="var(--red)" stroke-width="12" stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="678.6"/></svg>
      <div class="num"><b id="tNum">0:00</b><span id="tSub">目標 ${targetMin} 分鐘</span></div></div></div>
    <div class="stagehint" id="stageHint">按下紅色按鈕開始錄音與計時<br><span style="font-size:14px;color:var(--mute)">會依「起承轉合」提示你講到哪一段</span></div>
    <button class="recbtn" id="recBtn" aria-label="錄音"><i></i></button>
    <div class="lenpick">${[1,3,5,10].map(m => `<button class="chip ${m===targetMin?"on":""}" data-m="${m}">${m} 分鐘</button>`).join("")}</div>
    <div class="sec">我的錄音</div><div class="group" id="recList"><div class="empty" style="padding:24px">還沒有錄音</div></div>
    <div class="gfoot" style="margin:10px 4px">想要更具體的回饋？按錄音旁的分享，把檔案傳到 Claude App，貼上「自評」頁裡的提示詞，就能得到逐段建議。錄音只存在這支手機裡。</div>`;
  $$(".lenpick .chip").forEach(b => b.onclick = () => { if(rec) return; targetMin = +b.dataset.m; renderRec(); });
  $("#recBtn").onclick = () => rec ? stopRec() : startRec();
  listRecs();
}
async function startRec(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast("這個瀏覽器不支援錄音"); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("需要允許使用麥克風"); return; }
  const type = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined); recChunks = [];
  rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const dur = (Date.now() - recStart) / 1000, blob = new Blob(recChunks, {type: rec.mimeType || type || "audio/mp4"});
    rec = null;
    await idb.put({ id: Date.now(), date: current.date, title: current.title, dur, blob, type: blob.type });
    toast(`已存檔・${mmss(dur)}`); listRecs();
  };
  rec.start(); recStart = Date.now(); $("#recBtn").classList.add("on"); stopSpeak();
  const t = talkOf(current), total = targetMin * 60, arc = $("#arc");
  recTimer = setInterval(() => {
    const sec = (Date.now() - recStart) / 1000; $("#tNum").textContent = mmss(sec);
    arc.style.strokeDashoffset = 678.6 * (1 - Math.min(1, sec/total));
    arc.style.stroke = sec > total ? "#e5372b" : sec > total*0.85 ? "var(--gold)" : "var(--red)";
    $("#tSub").textContent = sec > total ? `超時 ${mmss(sec-total)}` : `剩 ${mmss(total-sec)}`;
    const st = stageAt(sec, t);
    if(st) $("#stageHint").innerHTML = `<b>${esc(st.stage)}</b>｜${esc(st.text)}`;
  }, 250);
}
function stopRec(){ clearInterval(recTimer); $("#recBtn")?.classList.remove("on"); try{ rec.stop(); }catch(e){} }
async function listRecs(){
  let all = []; try{ all = (await idb.all()).sort((a,b) => b.id - a.id); }catch(e){}
  const el = $("#recList"); if(!el) return;
  if(!all.length){ el.innerHTML = `<div class="empty" style="padding:24px">還沒有錄音</div>`; return; }
  el.innerHTML = all.map(r => { const d = new Date(r.id); return `<div class="rec" data-id="${r.id}">
    <button class="play" data-a="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="meta">${esc(r.title)}<span>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}・${mmss(r.dur)}</span></div>
    <button class="ic" data-a="share" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v13M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button class="ic" data-a="del" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`; }).join("");
  $$("#recList .rec").forEach(row => {
    const r = all.find(x => String(x.id) === row.dataset.id);
    row.querySelector('[data-a="play"]').onclick = e => {
      const btn = e.currentTarget;
      if(audioEl && audioEl._id === r.id && !audioEl.paused){ audioEl.pause(); btn.innerHTML = ICON_PLAY; return; }
      if(audioEl){ audioEl.pause(); }
      $$("#recList .play").forEach(b => b.innerHTML = ICON_PLAY);
      audioEl = new Audio(URL.createObjectURL(r.blob)); audioEl._id = r.id; audioEl.play().catch(()=>{});
      btn.innerHTML = ICON_PAUSE; audioEl.onended = () => btn.innerHTML = ICON_PLAY;
    };
    row.querySelector('[data-a="share"]').onclick = async () => {
      const ext = /webm/.test(r.type) ? "webm" : "m4a";
      const file = new File([r.blob], `練講-${r.date}-${r.id}.${ext}`, {type: r.type});
      try{ if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]}); else { const a = document.createElement("a"); a.href = URL.createObjectURL(r.blob); a.download = file.name; a.click(); } }catch(e){}
    };
    row.querySelector('[data-a="del"]').onclick = async () => { await idb.del(r.id); listRecs(); };
  });
}

/* self-check */
const CHECKS = [
  ["開場 30 秒內抓住注意", "用問題、畫面或故事，而不是「今天要講的是…」"],
  ["故事講得出場景與人物", "有時間、地點、對話，聽的人看得到畫面"],
  ["經文有逐句講清楚", "比喻是什麼、為什麼這樣比喻"],
  ["至少一個生活例子", "職場、家庭、手機…讓人點頭「對，我也是」"],
  ["連回求道人自身", "「這跟你有什麼關係」，而不只是知識"],
  ["用詞初機者聽得懂", "佛學名詞、人名有白話解釋，不一次丟太多"],
  ["結尾留下一句帶走的話", "短、好記，回家還記得"],
  ["時間控制在目標內", "語速穩、有停頓，不趕不拖"]
];
function renderCheck(){
  const key = "check:" + current.date, st = store.get(key, {on: [], note: ""});
  const box = $("#p-check");
  box.innerHTML = `<div class="group">` + CHECKS.map((c,i) => `<button class="check ${st.on.includes(i)?"on":""}" data-i="${i}"><div class="bx"></div><div><b>${c[0]}</b><span>${c[1]}</span></div></button>`).join("") + `</div>
    <div class="score" id="score"></div>
    <div class="sec">這次想改進的地方</div><textarea id="note" placeholder="例如：轉折太突然、例子可以換成…">${esc(st.note)}</textarea>
    <div class="sec">請 Claude 給回饋</div>
    <div class="box"><p style="font-size:15px;margin-bottom:10px">把錄音（或講稿）傳到 Claude App，貼上這段提示詞：</p>
    <button class="btn primary" id="copyPrompt" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>複製回饋提示詞</button></div>`;
  const upd = () => { $("#score").textContent = `完成 ${st.on.length} / ${CHECKS.length}`; store.set(key, st); };
  $$("#p-check .check").forEach(b => b.onclick = () => { const i = +b.dataset.i; st.on = st.on.includes(i) ? st.on.filter(x => x!==i) : [...st.on, i]; b.classList.toggle("on"); upd(); });
  $("#note").oninput = e => { st.note = e.target.value; store.set(key, st); };
  $("#copyPrompt").onclick = async () => {
    const p = `我在練講一貫道道義，主題是「${current.title}」（${current.source||""}），目標 ${talkOf(current).minutes||3} 分鐘，對象是剛求道的新道親。附上我的練講錄音／講稿。請你：\n1. 先模擬一位剛求道的人，說出聽完的真實感受（哪裡被打動、哪裡聽不懂、哪裡走神）。\n2. 依「開場、故事、經文解釋、生活例子、連回自身、結尾、時間語速」逐項給分（1–5）與具體修改建議。\n3. 指出經文或義理上有沒有講錯、講得不精確的地方。\n4. 給我一個改寫後更好的開場和結尾範例。\n我自己覺得要改進的：${st.note || "（無）"}`;
    try{ await navigator.clipboard.writeText(p); toast("已複製，貼到 Claude 即可"); }catch(e){ toast("複製失敗"); }
  };
  upd();
}

      <li>用 <b>Safari</b> 打開這個網頁（其他 App 內建的瀏覽器不行）</li>
      <li>點下方的「分享」按鈕 <span style="display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 5px;font-size:12px">↑</span></li>
      <li>往下滑，選「<b>加入主畫面</b>」</li>

      <p class="gfoot" style="margin:16px 0 0">之後從主畫面打開會是全螢幕，像一般 App 一樣，看過的故事也能離線閱讀。</p>`
    : `<h3>加到主畫面</h3><ol class="steps"><li>用 Chrome 打開這個網頁</li><li>點右上角「⋮」選單</li><li>選「<b>加到主畫面</b>」或「安裝應用程式」</li></ol>`);
}
$("#howInstall").onclick = showInstall;
$("#refresh").onclick = async () => { await boot(true); toast("已更新"); go("read"); };

/* ---------- boot ---------- */
async function boot(force){
  try{
    await loadIndex(force);
    if(!index.length){ $("#readInner").innerHTML = `<div class="empty">第一則故事正在準備中</div>`; return; }
    if(force) cache = {};
    const h = location.hash.replace("#", "");
    const target = index.find(x => x.date === h) ? h : index[0].date;
    await openStory(target);
  }catch(e){
    $("#readInner").innerHTML = `<div class="empty">讀不到故事，請確認網路後重新整理。</div>`;
  }
}
boot(false);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && index.length){ const before = index[0]?.date; loadIndex(true).then(() => { if(index[0]?.date !== before){ openStory(index[0].date); toast("今天的故事來了"); } }).catch(()=>{}); } });
})();
</script>
