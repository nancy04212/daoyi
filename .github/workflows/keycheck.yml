name: 檢查金鑰格式
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 只檢查格式，不顯示金鑰
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          k = os.environ.get("K", "")
          s = k.strip()
          print("length:", len(k), "stripped:", len(s))
          print("has_whitespace_or_newline:", k != s or bool(re.search(r"\s", s)))
          print("has_quotes:", any(c in s for c in "\"'"))
          print("starts_AIza:", s.startswith("AIza"))
          print("charset_ok:", bool(re.fullmatch(r"[A-Za-z0-9_\-\.]+", s)))
          try:
              r = urllib.request.urlopen(urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers={"x-goog-api-key": s}), timeout=30)
              ms = [m["name"] for m in json.load(r).get("models", []) if "tts" in m["name"].lower()]
              print("key_valid: True; tts models:", ms)
          except urllib.error.HTTPError as e:
              print("key_valid: False", e.code, json.loads(e.read()).get("error", {}).get("message"))
          PY
